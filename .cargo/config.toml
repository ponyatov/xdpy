[build]
target    = "x86_64-unknown-linux-gnu"
jobs      = 2

[target.x86_64-unknown-linux-gnu]
rustflags = ["--cfg", "feature=\"pc,linux\""]
linker    = "x86_64-linux-gnu-gcc"

# BPF target configuration
[target.bpfel-unknown-none]
linker = "llvm-link"
rustflags = [
    "-C", "panic=abort",
    "-C", "opt-level=s",
    "-C", "linker=llvm-link",
    "-C", "lto",
    "-Z", "unstable-options",  # For build-std feature
]

[alias]
bpf = "build --features bpf --target bpfel-unknown-none"
xdp = "build --bin xdp --target bpfel-unknown-none"
tc = "build --bin tc --target bpfel-unknown-none"

# eBPF environment configuration
[env]
BPF_CLANG = "clang"
BPF_CFLAGS = "-O2 -g -Wall -target bpf"
CARGO_CFG_BPF = "1"

# eBPF build settings
[target.bpfel-unknown-none.env]
RUST_LOG = "debug"
BPF_TARGET_DIR = "target/bpf"

[source.crates-io]
replace-with = 'ustc'

[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
[source.tuna]
registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
