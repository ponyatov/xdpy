[build]
target    = "x86_64-unknown-linux-gnu"
jobs      = 2

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]
extra-link-args = true

[target.x86_64-unknown-linux-gnu]
rustflags = ["--cfg", "feature=\"pc,linux\""]
linker    = "x86_64-linux-gnu-gcc"

# BPF target configuration
[target.bpfel-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "panic=abort",
    "-C", "opt-level=2",
    "-C", "target-cpu=generic",
    "-C", "no-redzone"
]

[alias]
bpf = "build --lib --features bpf --target .cargo/bpfel-unknown-none.json"
xdp = "build --bin xdp --target .cargo/bpfel-unknown-none.json"
tc = "build --bin tc --target .cargo/bpfel-unknown-none.json"

# eBPF environment configuration
[env]
BPF_CLANG = "clang"
BPF_CFLAGS = "-O2 -g -Wall -target bpf"
CARGO_CFG_BPF = "1"

# eBPF build settings
[target.bpfel-unknown-none.env]
RUST_LOG = "debug"
BPF_TARGET_DIR = "target/bpf"

[source.crates-io]
replace-with = 'ustc'

[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
[source.tuna]
registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
